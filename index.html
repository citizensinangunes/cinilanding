<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e1aff">
  <meta name="description" content="Touros Studio — an independent Turkish game studio. New worlds are coming soon.">
  <title>Touros Studio — Coming soon</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #2e1aff; color: #fff; }
    body { margin: 0; }
    main { min-height: 100svh; display: grid; grid-template-rows: 1fr auto 1fr; padding: 30px 6vw; text-align: center; }
    .top { align-self: start; display: flex; justify-content: space-between; gap: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: .18em; opacity: .8; }
    .brand { grid-row: 2; width: min(100%, 1000px); margin: 0 auto; }
    .brand img { display: block; width: 100%; height: auto; max-height: 60svh; object-fit: contain; }
    .wordmark { margin: 0; font-size: clamp(72px, 17vw, 230px); font-weight: 900; letter-spacing: -.075em; line-height: .9; }
    .studio { display: block; font-size: clamp(17px, 3.5vw, 45px); font-weight: 400; letter-spacing: .65em; margin: 20px 0 0 38%; }
    .bottom { grid-row: 3; display: flex; flex-direction: column; justify-content: space-between; padding-top: 38px; gap: 46px; }
    h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .28em; font-weight: 500; margin: 0 0 14px; }
    p { font-size: 14px; line-height: 1.6; opacity: .7; margin: 0; }
    footer { font-size: 10px; opacity: .55; letter-spacing: .06em; }
    @media (max-width: 600px) { main { padding: 24px 6vw; } .top { font-size: 8px; letter-spacing: .1em; } .studio { margin-top: 14px; } .bottom { padding-top: 32px; } p { font-size: 12px; } }
  </style>
</head>
<body>
  <main>
    <div class="top"><span>Independent Turkish game studio</span><span>New worlds ahead</span></div>
    <div class="brand" aria-label="Touros Studio">
      <!-- Replace the fallback with the supplied logo once its original image file is available. -->
      <div class="wordmark" aria-hidden="true">touros<span class="studio">studio</span></div>
    </div>
    <div class="bottom">
      <section><h1>Coming soon</h1><p>Crafted in Türkiye. Made for players everywhere.</p></section>
      <footer>© <span id="year">2026</span> Touros Studio</footer>
    </div>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
